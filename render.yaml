services:
  # Backend: API REST + Socket.IO + Supabase (Postgres + Auth + Storage)
  - type: web
    name: domino-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  # Frontend web: export estático de Expo (bundle con la URL del servidor)
  - type: web
    name: domino-web
    runtime: static
    buildCommand: npm install && EXPO_PUBLIC_API_URL="https://$API_HOST" npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_HOST
        fromService:
          name: domino-server
          type: web
          property: host
